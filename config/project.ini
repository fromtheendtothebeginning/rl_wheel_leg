# 本项目所有可调项都在这里，脚本里不再写死数字和路径。
#
# - 路径支持 ${HOME} 这类环境变量；相对路径按仓库根目录解析。
# - 命令行参数会覆盖这里的值（例如 --steps 500）。

[paths]
# 机器人包目录
robot_dir = rl_chassis
# 生成的 USD / 渲染图（已 gitignore）
out_dir = out
# 装了 Isaac Sim 的 Python 环境；跑 Isaac 相关脚本时用它的 python
isaac_venv = ${HOME}/IsaacLab-3.0/.venv

[mujoco]
scene = rl_chassis/mjcf/rl_chassis_v12_scene.xml
# headless 仿真时长（秒）
seconds = 3.0
# 6 个力矩电机稳在 home 位姿用的 PD 增益
kp = 200.0
kd = 8.0
# 轮子常值力矩（N·m），非 0 就往前跑
wheel_torque = 0.0

[mujoco.render]
width = 1280
height = 960
azimuth = 140.0
elevation = -16.0
distance = 1.6

[isaac]
# 机器人 USD（由 scripts/convert_robot_usd.py 生成）。默认用 MJCF weld 版：
# 它保留 4 条闭链；URDF 版只有运动学树，腿会自由摆动
usd = out/rl_chassis_v12_mjcf_weld/rl_chassis_v12.usda
png = out/isaac_render.png
steps = 240
width = 1280
height = 800
# 场景尺度：机器人只有十几厘米高，地面铺太大等于把阴影贴图分辨率浪费在远处
ground_size = 2.0
dome_intensity = 600.0
key_intensity = 2500.0
# 相机按包围盒自动取景：距离 = 最大边长 × margin
camera_margin = 1.9
focal_length = 28.0

[isaac.smoke]
png = out/smoke_isaac.png
steps = 150
width = 640
height = 480
cube_size = 0.3
cube_z = 2.0
camera_margin = 6.0
